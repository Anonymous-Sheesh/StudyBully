plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ibad.studybully'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ibad.studybully'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed personal key so every new build installs over the old one.
    signingConfigs {
        bully {
            storeFile file('studybully.jks')
            storePassword 'studybully'
            keyAlias 'studybully'
            keyPassword 'studybully'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.bully }
        debug { signingConfig signingConfigs.bully }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}
